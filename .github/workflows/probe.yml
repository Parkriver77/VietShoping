name: Probe stores (manual, debug)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - continue-on-error: true
        name: Phong Vu without slug
        run: |
          for body in '{"terminalId":4,"page":1,"pageSize":2,"filter":{},"isNeedFeaturedProducts":false,"query":"laptop asus"}' '{"terminalId":4,"page":1,"pageSize":2,"slug":"","filter":{},"query":"laptop asus"}'; do
            curl -s --max-time 20 -X POST "https://discovery.tekoapis.com/api/v2/search-skus-v2" -H "content-type: application/json" -H "origin: https://phongvu.vn" -H "referer: https://phongvu.vn/" -d "$body" -w "\n-> %{http_code}\n" | python3 -c "
          import sys,json
          raw=sys.stdin.read(); print(raw[-30:])
          try:
              j=json.loads(raw[:raw.rfind('\n->')])
              ps=j['data']['products']; print('N',len(ps)); p=ps[0]
              print(json.dumps(p,ensure_ascii=False)[:1500])
          except Exception as e: print('ERR',e, raw[:400])
          "
          done
      - continue-on-error: true
        name: CellphoneS structure
        run: |
          curl -s --max-time 20 -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1" "https://cellphones.com.vn/catalogsearch/result?q=iphone%2016" -o c.html
          python3 - <<'PY'
          import re
          h=open('c.html',encoding='utf-8',errors='ignore').read()
          i=h.find('product-info'); print('product-info at',i)
          print(h[i-200:i+1800] if i>0 else h[:1500])
          print('NUXT' , '__NUXT__' in h, 'graphql' in h)
          for m in re.findall(r'https://api[^"\' ]*cellphones[^"\' ]*', h)[:10]: print('API', m)
          PY
      - continue-on-error: true
        name: GearVN structure
        run: |
          curl -s --max-time 20 -A "Mozilla/5.0" "https://gearvn.com/search?type=product&q=mini%20pc" -o g.html
          python3 - <<'PY'
          h=open('g.html',encoding='utf-8',errors='ignore').read()
          for key in ['proloop-name','product-name','proloop-price','data-id=']:
              i=h.find(key); print('==',key,i); 
              if i>0: print(h[i-300:i+900]); break
          PY
          curl -s --max-time 20 -A "Mozilla/5.0" "https://gearvn.com/search?type=product&q=mini%20pc&view=json" | head -c 600; echo
      - continue-on-error: true
        name: Hasaki structure
        run: |
          curl -s --max-time 20 -A "Mozilla/5.0" "https://hasaki.vn/catalogsearch/result?q=kem%20chong%20nang" -o h.html
          python3 - <<'PY'
          h=open('h.html',encoding='utf-8',errors='ignore').read()
          for key in ['item_sp_hasaki','vn_names','item_giamoi','product-item']:
              i=h.find(key); print('==',key,i)
              if i>0: print(h[i-300:i+1200]); break
          PY
