name: Deploy to Netlify (manual)

# 수동 실행 전용: Actions 탭 → "Deploy to Netlify (manual)" → Run workflow
# 필요한 것: 저장소 Secrets 에 NETLIFY_AUTH_TOKEN (Netlify 개인 액세스 토큰)
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # 토큰 주인 계정에서 이 이름의 프로젝트를 찾고, 없으면 새로 만든다
  NETLIFY_SITE_NAME: vietshoping-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Deploy (production)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN 시크릿이 없습니다. Settings → Secrets and variables → Actions 에 추가하세요."
            exit 1
          fi
          # 토큰 점검
          code=$(curl -s -o /tmp/u.json -w "%{http_code}" -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" https://api.netlify.com/api/v1/user)
          if [ "$code" != "200" ]; then
            echo "::error::Netlify 토큰이 올바르지 않습니다 (HTTP $code). 토큰 이름이 아니라 만들 때 한 번만 보이는 긴 토큰 값을 넣었는지 확인하세요."
            exit 1
          fi
          email=$(python3 -c "import json;e=json.load(open('/tmp/u.json')).get('email','');print(e[:3]+'***'+e[e.find('@'):])")
          echo "토큰 계정: $email"

          # 프로젝트 찾기 또는 만들기
          curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/sites?name=$NETLIFY_SITE_NAME&filter=all&per_page=100" > /tmp/sites.json
          NETLIFY_SITE_ID=$(python3 -c "import json,os;n=os.environ['NETLIFY_SITE_NAME'];print(next((x['id'] for x in json.load(open('/tmp/sites.json')) if x.get('name')==n),''))")
          if [ -z "$NETLIFY_SITE_ID" ]; then
            echo "프로젝트 $NETLIFY_SITE_NAME 가 없어 새로 만듭니다."
            code=$(curl -s -o /tmp/new.json -w "%{http_code}" -X POST -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" -H "Content-Type: application/json" -d "{\"name\":\"$NETLIFY_SITE_NAME\"}" https://api.netlify.com/api/v1/sites)
            if [ "$code" != "201" ] && [ "$code" != "200" ]; then
              echo "::error::프로젝트를 만들지 못했습니다 (HTTP $code): $(cat /tmp/new.json | head -c 300)"
              exit 1
            fi
            NETLIFY_SITE_ID=$(python3 -c "import json;print(json.load(open('/tmp/new.json'))['id'])")
          fi
          echo "프로젝트: $NETLIFY_SITE_NAME ($NETLIFY_SITE_ID)"
          npx -y netlify-cli@23 deploy --prod --dir=public --functions=netlify/functions --site="$NETLIFY_SITE_ID" --message "GitHub manual deploy ${GITHUB_SHA::7}"

      - name: Smoke test
        run: |
          sleep 5
          curl -sS "https://vietshoping-app.netlify.app/api/search?q=iphone%2016&used=2" | head -c 1500; echo
